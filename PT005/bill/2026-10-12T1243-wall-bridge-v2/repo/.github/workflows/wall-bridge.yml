# Wall bridge. GitHub runs this only after it is copied to the mailbox
# repository root. A copy under PT005/bill/ is not a workflow.
name: wall-bridge

on:
  push:
    branches: [main]
    paths:
      - PT005/bridge/RELEASE
      - PT006/bridge/RELEASE
      - PT005/bridge/PAUSE
      - PT006/bridge/PAUSE
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wall-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: test
        run: python3 PT005/bridge/bridge_test.py

      - name: post
        env:
          PLAY_BRIDGE_KEY: ${{ secrets.PLAY_BRIDGE_KEY }}
          TZ: Asia/Kuala_Lumpur
        run: python3 PT005/bridge/bridge.py
