# Private repo only. workflow_dispatch only. Do not add pull_request or pull_request_target.
name: office-gate
on:
  workflow_dispatch:
    inputs:
      gate:
        description: Menu item
        required: true
        type: choice
        options:
          - status
          - p233-pack
          - p191
          - p241ab
          - p241c
          - collect
      collect_which:
        description: Used only when gate is collect
        required: true
        default: none
        type: choice
        options:
          - none
          - p191
          - p241ab
          - p241c
          - all
permissions:
  contents: write
concurrency:
  group: office-gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: [self-hosted, office-wsl]
    timeout-minutes: 30
    steps:
      - name: fetch this repo at the dispatched commit
        env:
          TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.extraheader "AUTHORIZATION: bearer ${TOKEN}"
          git fetch -q --depth 1 origin "${GITHUB_SHA}"
          git checkout -q --detach FETCH_HEAD
          git config --unset-all http.extraheader
      - name: menu
        env:
          GATE: ${{ inputs.gate }}
          COLLECT_WHICH: ${{ inputs.collect_which }}
          RESULT_TOKEN: ${{ github.token }}
          RESULT_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash gates/dispatch.sh
